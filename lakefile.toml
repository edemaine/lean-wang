name = "lean_wang"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanWang"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
# Kernel reduction of the finite certificates needs larger elaboration limits.
maxHeartbeats = 2000000
maxRecDepth = 10000
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "LeanWang"
